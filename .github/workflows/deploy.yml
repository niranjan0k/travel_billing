- name: Deploy to server
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.SERVER_HOST }}      # → 203.0.113.45
    username: ${{ secrets.SERVER_USER }}  # → deploy
    key: ${{ secrets.SSH_PRIVATE_KEY }}   # → contents of deploy_key
    script: |
      cd /var/www/html/travel_billing
      git pull origin main